aid: the-lottery-corporation

name: The Lottery Corporation

description: The Lottery Corporation Limited (ASX:TLC) is an Australian lottery and Keno operator, the home of The Lott and
  Keno brands, running Australia's biggest lottery games in every state and territory except Western Australia and describing
  itself as one of the world's top-performing lottery businesses, now evolving into a digitally led entertainment company.
  Its corporate site (thelotterycorporation.com) covers its brands, investors, ESG, careers (including tech careers) and news;
  no public developer API or documentation is published there.

